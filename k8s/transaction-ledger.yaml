apiVersion: apps/v1
kind: Deployment
metadata:
  name: transaction-ledger
  namespace: upi-payments-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: transaction-ledger
  template:
    metadata:
      labels:
        app: transaction-ledger
    spec:
      containers:
        - name: transaction-ledger
          image: ghcr.io/j4vedskh/upi-payments-simulator-lab/transaction-ledger:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8082
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: kafka
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: kafka:9092
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8082
            initialDelaySeconds: 20
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: transaction-ledger
  namespace: upi-payments-lab
spec:
  selector:
    app: transaction-ledger
  ports:
    - name: http
      port: 8082
      targetPort: 8082

