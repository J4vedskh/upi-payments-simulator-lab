apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  namespace: upi-payments-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment-service
  template:
    metadata:
      labels:
        app: payment-service
    spec:
      containers:
        - name: payment-service
          image: ghcr.io/j4vedskh/upi-payments-simulator-lab/payment-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: kafka
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: kafka:9092
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8081
            initialDelaySeconds: 20
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: payment-service
  namespace: upi-payments-lab
spec:
  selector:
    app: payment-service
  ports:
    - name: http
      port: 8081
      targetPort: 8081

