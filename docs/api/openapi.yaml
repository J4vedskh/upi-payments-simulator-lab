openapi: 3.0.3
info:
  title: UPI Payments Simulator API
  version: 0.1.0
  description: Payment command and ledger APIs for the UPI Payments Simulator Lab. The bearer requirement on payment submission applies when the opt-in secure profile is active.
servers:
  - url: http://localhost:8081
    description: Payment Service
  - url: http://localhost:8082
    description: Transaction Ledger
paths:
  /api/payments:
    post:
      summary: Submit a UPI-style payment command
      operationId: submitPayment
      description: >-
        The default profile accepts anonymous requests. The opt-in secure profile
        requires an HS256 bearer token with payment.write in the scope claim. An
        optional Idempotency-Key deduplicates retries within one process after the
        initial keyed request returns 202, returning the original decision when the
        normalized payment request is equivalent.
      servers:
        - url: http://localhost:8081
          description: Payment Service
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentRequest"
      responses:
        "202":
          description: Payment decision accepted; an equivalent keyed replay returns the original decision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentResponse"
        "400":
          description: Request validation failed, JSON body could not be read, an undeclared field was supplied, or Idempotency-Key was invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                fieldValidation:
                  summary: Bindable JSON failed field validation
                  value:
                    timestamp: "2026-11-03T05:00:00Z"
                    status: 400
                    error: VALIDATION_FAILED
                    message: Request validation failed.
                    path: /api/payments
                    validationErrors:
                      payerVpa: must not be blank
                malformedBody:
                  summary: JSON body could not be read or contained an undeclared field
                  value:
                    timestamp: "2026-11-03T05:00:00Z"
                    status: 400
                    error: VALIDATION_FAILED
                    message: Request body is malformed.
                    path: /api/payments
                    validationErrors: {}
                invalidIdempotencyKey:
                  summary: Idempotency-Key failed bounded visible-ASCII validation
                  value:
                    timestamp: "2026-11-11T05:00:00Z"
                    status: 400
                    error: VALIDATION_FAILED
                    message: Idempotency-Key must contain 1 to 128 visible ASCII characters.
                    path: /api/payments
                    validationErrors: {}
        "409":
          description: Idempotency-Key was reused for different normalized payment details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                timestamp: "2026-11-11T05:00:00Z"
                status: 409
                error: IDEMPOTENCY_CONFLICT
                message: Idempotency-Key was already used for a different payment request.
                path: /api/payments
                validationErrors: {}
        "415":
          description: Request Content-Type is not supported after any required authentication succeeds
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                timestamp: "2026-11-02T05:00:00Z"
                status: 415
                error: UNSUPPORTED_MEDIA_TYPE
                message: Content-Type is not supported for this endpoint.
                path: /api/payments
                validationErrors: {}
        "401":
          description: Bearer token is missing or invalid in the secure profile
          headers:
            WWW-Authenticate:
              description: Standard Bearer authentication challenge
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                timestamp: "2026-11-04T05:00:00Z"
                status: 401
                error: UNAUTHORIZED
                message: Bearer authentication is required.
                path: /api/payments
                validationErrors: {}
        "403":
          description: Bearer token does not grant the payment.write scope
          headers:
            WWW-Authenticate:
              description: Standard Bearer insufficient-scope challenge
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                timestamp: "2026-11-04T05:00:00Z"
                status: 403
                error: FORBIDDEN
                message: Access is denied.
                path: /api/payments
                validationErrors: {}
  /api/payments/{paymentId}:
    get:
      summary: Fetch a payment decision
      operationId: getPayment
      servers:
        - url: http://localhost:8081
          description: Payment Service
      parameters:
        - $ref: "#/components/parameters/PaymentId"
      responses:
        "200":
          description: Payment decision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentResponse"
        "404":
          description: Payment was not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                timestamp: "2026-11-07T13:00:00Z"
                status: 404
                error: NOT_FOUND
                message: Payment not found.
                path: /api/payments/pay_missing
                validationErrors: {}
  /internal/events/payments:
    post:
      summary: Record a payment event directly in the ledger
      description: >-
        Internal local-demo intake that records the same event shape consumed from
        Kafka. Ledger ingestion is idempotent by paymentId: the first successful
        record creates the immutable entry and replays return it unchanged without
        incrementing the ledger-record counter. This endpoint is hosted by the ledger
        service and does not use the payment-service secure profile.
      operationId: recordPaymentEvent
      servers:
        - url: http://localhost:8082
          description: Transaction Ledger
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentEvent"
      responses:
        "200":
          description: Successfully recorded ledger entry for the payment ID; replays return the unchanged existing entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LedgerEntry"
        "400":
          description: Payment event JSON is malformed, missing a required field, or contains an undeclared field
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                timestamp: "2026-11-01T10:00:00Z"
                status: 400
                error: VALIDATION_FAILED
                message: Request body is malformed or missing a required field.
                path: /internal/events/payments
                validationErrors: {}
        "415":
          description: Request Content-Type is not supported
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                timestamp: "2026-11-02T05:00:00Z"
                status: 415
                error: UNSUPPORTED_MEDIA_TYPE
                message: Content-Type is not supported for this endpoint.
                path: /internal/events/payments
                validationErrors: {}
  /api/ledger:
    get:
      summary: List ledger entries
      operationId: listLedgerEntries
      servers:
        - url: http://localhost:8082
          description: Transaction Ledger
      responses:
        "200":
          description: Ledger entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LedgerEntry"
  /api/ledger/{paymentId}:
    get:
      summary: Fetch one ledger entry
      operationId: getLedgerEntry
      servers:
        - url: http://localhost:8082
          description: Transaction Ledger
      parameters:
        - $ref: "#/components/parameters/PaymentId"
      responses:
        "200":
          description: Ledger entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LedgerEntry"
        "404":
          description: Ledger entry was not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                timestamp: "2026-11-07T13:00:00Z"
                status: 404
                error: NOT_FOUND
                message: Ledger entry not found.
                path: /api/ledger/pay_missing
                validationErrors: {}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: The secure profile accepts HS256 JWTs with payment.write in the scope claim.
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: >-
        Opaque retry key. Values must contain 1 to 128 visible ASCII characters.
        The raw key is represented only by a SHA-256 hash; the cache also retains the
        original payment response. Replay state resets when the payment-service
        process restarts.
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: '^[!-~]+$'
        example: retry-8f735e19-53a7-4af8-aad1-2a61a392674d
    PaymentId:
      name: paymentId
      in: path
      required: true
      schema:
        type: string
        example: pay_7b873df0-3928-4d55-b015-bef1bd8cb1bd
  schemas:
    PaymentRequest:
      type: object
      additionalProperties: false
      required:
        - payerVpa
        - payeeVpa
        - amount
        - currency
        - channel
      properties:
        payerVpa:
          type: string
          minLength: 1
          pattern: '.*\S.*'
          example: alice@upi
        payeeVpa:
          type: string
          minLength: 1
          pattern: '.*\S.*'
          example: merchant@upi
        amount:
          type: number
          minimum: 0.01
          example: 249.50
        currency:
          type: string
          minLength: 1
          pattern: '.*\S.*'
          example: INR
        channel:
          type: string
          minLength: 1
          pattern: '.*\S.*'
          example: MOBILE
    PaymentResponse:
      type: object
      required:
        - paymentId
        - payerVpa
        - payeeVpa
        - amount
        - currency
        - status
        - decisionCode
        - decisionMessage
        - decidedAt
      properties:
        paymentId:
          type: string
        payerVpa:
          type: string
        payeeVpa:
          type: string
        amount:
          type: number
        currency:
          type: string
        status:
          type: string
          enum: [ACCEPTED, REVIEW, REJECTED]
        decisionCode:
          type: string
        decisionMessage:
          type: string
        decidedAt:
          type: string
          format: date-time
    PaymentEvent:
      type: object
      additionalProperties: false
      required:
        - paymentId
        - payerVpa
        - payeeVpa
        - amount
        - currency
        - status
        - decisionCode
        - decisionMessage
        - decidedAt
      properties:
        paymentId:
          type: string
          example: pay_7b873df0-3928-4d55-b015-bef1bd8cb1bd
        payerVpa:
          type: string
          example: alice@upi
        payeeVpa:
          type: string
          example: merchant@upi
        amount:
          type: number
          example: 50000.00
        currency:
          type: string
          example: INR
        status:
          type: string
          enum: [ACCEPTED, REVIEW, REJECTED]
          example: REVIEW
        decisionCode:
          type: string
          example: HIGH_VALUE_PAYMENT
        decisionMessage:
          type: string
          example: Payment amount requires manual review.
        decidedAt:
          type: string
          format: date-time
          example: "2026-10-22T05:30:00Z"
    LedgerEntry:
      type: object
      required:
        - paymentId
        - payerVpa
        - payeeVpa
        - amount
        - currency
        - status
        - decisionCode
        - recordedAt
      properties:
        paymentId:
          type: string
        payerVpa:
          type: string
        payeeVpa:
          type: string
        amount:
          type: number
        currency:
          type: string
        status:
          type: string
          enum: [ACCEPTED, REVIEW, REJECTED]
        decisionCode:
          type: string
        recordedAt:
          type: string
          format: date-time
    ErrorResponse:
      type: object
      additionalProperties: false
      required:
        - timestamp
        - status
        - error
        - message
        - path
        - validationErrors
      properties:
        timestamp:
          type: string
          format: date-time
        status:
          type: integer
          example: 400
        error:
          type: string
          example: VALIDATION_FAILED
        message:
          type: string
          example: Request validation failed.
        path:
          type: string
          example: /api/payments
        validationErrors:
          type: object
          additionalProperties:
            type: string

