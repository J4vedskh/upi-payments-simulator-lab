openapi: 3.0.3
info:
  title: UPI Payments Simulator API
  version: 0.1.0
  description: Payment command and ledger APIs for the UPI Payments Simulator Lab. The bearer requirement on payment submission applies when the opt-in secure profile is active.
servers:
  - url: http://localhost:8081
    description: Payment Service
  - url: http://localhost:8082
    description: Transaction Ledger
paths:
  /api/payments:
    post:
      summary: Submit a UPI-style payment command
      operationId: submitPayment
      description: The default profile accepts anonymous requests. The opt-in secure profile requires an HS256 bearer token with payment.write in the scope claim.
      servers:
        - url: http://localhost:8081
          description: Payment Service
      security:
        - {}
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentRequest"
      responses:
        "202":
          description: Payment decision accepted for processing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentResponse"
        "400":
          description: Request validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Bearer token is missing or invalid in the secure profile
        "403":
          description: Bearer token does not grant the payment.write scope
  /api/payments/{paymentId}:
    get:
      summary: Fetch a payment decision
      operationId: getPayment
      servers:
        - url: http://localhost:8081
          description: Payment Service
      parameters:
        - $ref: "#/components/parameters/PaymentId"
      responses:
        "200":
          description: Payment decision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentResponse"
        "404":
          description: Payment was not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /internal/events/payments:
    post:
      summary: Record a payment event directly in the ledger
      description: Internal local-demo intake that records the same event shape consumed from Kafka. This endpoint is hosted by the ledger service and does not use the payment-service secure profile.
      operationId: recordPaymentEvent
      servers:
        - url: http://localhost:8082
          description: Transaction Ledger
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentEvent"
      responses:
        "200":
          description: Payment event recorded in the ledger
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LedgerEntry"
        "400":
          description: Payment event JSON is malformed or missing a required field
  /api/ledger:
    get:
      summary: List ledger entries
      operationId: listLedgerEntries
      servers:
        - url: http://localhost:8082
          description: Transaction Ledger
      responses:
        "200":
          description: Ledger entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LedgerEntry"
  /api/ledger/{paymentId}:
    get:
      summary: Fetch one ledger entry
      operationId: getLedgerEntry
      servers:
        - url: http://localhost:8082
          description: Transaction Ledger
      parameters:
        - $ref: "#/components/parameters/PaymentId"
      responses:
        "200":
          description: Ledger entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LedgerEntry"
        "404":
          description: Ledger entry was not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: The secure profile accepts HS256 JWTs with payment.write in the scope claim.
  parameters:
    PaymentId:
      name: paymentId
      in: path
      required: true
      schema:
        type: string
        example: pay_7b873df0-3928-4d55-b015-bef1bd8cb1bd
  schemas:
    PaymentRequest:
      type: object
      required:
        - payerVpa
        - payeeVpa
        - amount
        - currency
        - channel
      properties:
        payerVpa:
          type: string
          example: alice@upi
        payeeVpa:
          type: string
          example: merchant@upi
        amount:
          type: number
          minimum: 0.01
          example: 249.50
        currency:
          type: string
          example: INR
        channel:
          type: string
          example: MOBILE
    PaymentResponse:
      type: object
      required:
        - paymentId
        - payerVpa
        - payeeVpa
        - amount
        - currency
        - status
        - decisionCode
        - decisionMessage
        - decidedAt
      properties:
        paymentId:
          type: string
        payerVpa:
          type: string
        payeeVpa:
          type: string
        amount:
          type: number
        currency:
          type: string
        status:
          type: string
          enum: [ACCEPTED, REVIEW, REJECTED]
        decisionCode:
          type: string
        decisionMessage:
          type: string
        decidedAt:
          type: string
          format: date-time
    PaymentEvent:
      type: object
      required:
        - paymentId
        - payerVpa
        - payeeVpa
        - amount
        - currency
        - status
        - decisionCode
        - decisionMessage
        - decidedAt
      properties:
        paymentId:
          type: string
          example: pay_7b873df0-3928-4d55-b015-bef1bd8cb1bd
        payerVpa:
          type: string
          example: alice@upi
        payeeVpa:
          type: string
          example: merchant@upi
        amount:
          type: number
          example: 50000.00
        currency:
          type: string
          example: INR
        status:
          type: string
          enum: [ACCEPTED, REVIEW, REJECTED]
          example: REVIEW
        decisionCode:
          type: string
          example: HIGH_VALUE_PAYMENT
        decisionMessage:
          type: string
          example: Payment amount requires manual review.
        decidedAt:
          type: string
          format: date-time
          example: "2026-10-22T05:30:00Z"
    LedgerEntry:
      type: object
      required:
        - paymentId
        - payerVpa
        - payeeVpa
        - amount
        - currency
        - status
        - decisionCode
        - recordedAt
      properties:
        paymentId:
          type: string
        payerVpa:
          type: string
        payeeVpa:
          type: string
        amount:
          type: number
        currency:
          type: string
        status:
          type: string
          enum: [ACCEPTED, REVIEW, REJECTED]
        decisionCode:
          type: string
        recordedAt:
          type: string
          format: date-time
    ErrorResponse:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        status:
          type: integer
          example: 400
        error:
          type: string
          example: VALIDATION_FAILED
        message:
          type: string
          example: Request validation failed.
        path:
          type: string
          example: /api/payments
        validationErrors:
          type: object
          additionalProperties:
            type: string

