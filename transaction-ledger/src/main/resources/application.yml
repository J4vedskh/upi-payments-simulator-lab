server:
  port: 8082

spring:
  application:
    name: transaction-ledger
  jackson:
    deserialization:
      fail-on-unknown-properties: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

app:
  kafka:
    topics:
      payment-events: payment-events

