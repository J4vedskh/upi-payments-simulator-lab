server:
  port: 8081

spring:
  application:
    name: payment-service
  jackson:
    deserialization:
      fail-on-unknown-properties: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

app:
  idempotency:
    max-entries: ${UPI_IDEMPOTENCY_MAX_ENTRIES:10000}
    retention: ${UPI_IDEMPOTENCY_RETENTION:24h}
  fraud:
    review-threshold: ${UPI_FRAUD_REVIEW_THRESHOLD:50000.00}
    block-threshold: ${UPI_FRAUD_BLOCK_THRESHOLD:200000.00}
  kafka:
    topics:
      payment-events: payment-events

