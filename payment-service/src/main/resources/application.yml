server:
  port: 8081

spring:
  application:
    name: payment-service

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

app:
  fraud:
    review-threshold: ${UPI_FRAUD_REVIEW_THRESHOLD:50000.00}
    block-threshold: ${UPI_FRAUD_BLOCK_THRESHOLD:200000.00}
  kafka:
    topics:
      payment-events: payment-events

