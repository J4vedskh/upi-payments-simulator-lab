site_name: UPI Payments Simulator Lab
site_description: UPI-style payments simulator with Spring Boot, Kafka, fraud detection, and live portfolio documentation.
site_url: https://j4vedskh.github.io/upi-payments-simulator-lab/
repo_url: https://github.com/J4vedskh/upi-payments-simulator-lab
repo_name: J4vedskh/upi-payments-simulator-lab
theme:
  name: material
  language: en
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.instant
    - content.code.copy
    - toc.follow
  palette:
    - scheme: default
      primary: indigo
      accent: teal
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
nav:
  - Overview: index.md
  - Architecture: architecture.md
  - API Reference: api-reference.md
  - Runbook: runbook.md
  - Roadmap: roadmap.md
extra_css:
  - stylesheets/extra.css

