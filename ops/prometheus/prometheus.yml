global:
  scrape_interval: 15s

scrape_configs:
  - job_name: payment-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["payment-service:8081"]

  - job_name: transaction-ledger
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["transaction-ledger:8082"]

